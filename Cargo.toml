[package]
name = "selx"
description = "selx: editor selection bridge for terminal AI agents"
version = "0.1.0"
edition = "2021"
# The floor the whole graph builds on. The code itself needs 1.82
# (`Option::is_none_or`); clap 4.6 and uuid 1.25 raise it to 1.85.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/hungryhorace/selx"
readme = "README.md"
keywords = ["helix", "lazygit", "claude-code", "terminal", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "signal", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustix = { version = "1", features = ["fs", "process", "std"] }
directories = "6"
basic-toml = "0.1"
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
panic = "unwind"
